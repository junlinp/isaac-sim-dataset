name: CPU trajectory checks
on: [push, pull_request]
jobs:
  trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest
      - run: python -m pytest -q
